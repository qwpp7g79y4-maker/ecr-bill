[package]
name = "ecr-bill"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline ECR storage cost from describe-images JSON"
readme = "README.md"
repository = "https://github.com/qwpp7g79y4-maker/ecr-bill"
homepage = "https://www.pepai.nl"
documentation = "https://github.com/qwpp7g79y4-maker/ecr-bill"
keywords = ["aws", "ecr", "images", "cost", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/build.rs",
    "/about.hbs",
    "/about.toml",
    "/src/",
    "/tests/",
    "/examples/",
    "/man/",
    "/scripts/",
    "/prices/",
    "/Cargo.lock",
    "/.gitattributes",
    "/README.md",
    "/README.nl.md",
    "/CONTRIBUTING.md",
    "/QUALITY.nl.md",
    "/QUALITY.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/deny.toml",
]

[lib]
name = "ecr_bill"
path = "src/lib.rs"

[[bin]]
name = "ecr-bill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rust_decimal = "1.43.0"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "unbounded_depth"] }
